name: Test Jenkins connection

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Verify Cloudflare Access and Jenkins
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Jenkins API
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          JENKINS_USER: ${{ secrets.JENKINS_RELEASE_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_RELEASE_API_TOKEN }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --user "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
              --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "https://jenkins.t-wk.com/api/json"
          )"

          if [[ "$http_code" != "200" ]]; then
            echo "Jenkins 连通性检查失败，HTTP ${http_code}"
            sed -n '1,20p' "$response_file"
            exit 1
          fi

          echo "Cloudflare Access 和 Jenkins API 认证成功。"
